name: Publicar Release (macOS y Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: Compilar para macOS (.dmg)
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar aplicación e instaladores macOS (.dmg)
        run: npm run electron:build:mac

      - name: Subir instaladores de Mac como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: |
            dist-electron/*.dmg
            dist-electron/Desinstalador-ECONEXO-mac.zip
          if-no-files-found: error

  build-windows:
    name: Compilar para Windows (.exe)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar instalador Windows (.exe NSIS)
        run: npm run electron:build:win

      - name: Subir instalador de Windows como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist-electron/*.exe
            dist-electron/Desinstalador-ECONEXO-windows.zip
          if-no-files-found: error

  publish-release:
    name: Crear Release en GitHub
    needs: [build-mac, build-windows]
    if: always() && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar todos los instaladores
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: Listar binarios listos para publicar
        run: ls -la release-binaries

      - name: Publicar Release oficial en GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ECONEXO v1.0.0
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 🚀 ECONEXO v1.0.0 — Dashboard Financiero Local

            ¡Primera versión oficial de **ECONEXO** como aplicación de escritorio nativa para **macOS** y **Windows**!

            ### 📦 Descargas Disponibles:

            #### 🍏 Para macOS:
            - **`ECONEXO-1.0.0-arm64.dmg`**: Para Macs con chip Apple Silicon (**M1, M2, M3, M4**).
            - **`ECONEXO-1.0.0.dmg`**: Para Macs con procesador **Intel**.
            - **`Desinstalador-ECONEXO-mac.zip`**: App complementaria para desinstalar ECONEXO y borrar todos sus datos locales en 1 clic.

            #### 🪟 Para Windows:
            - **`ECONEXO Setup 1.0.0.exe`**: Instalador oficial para **Windows 10 / 11 (64-bit)** con accesos directos y desinstalador automático integrado.
            - **`Desinstalador-ECONEXO-windows.zip`**: Script complementario para desinstalar ECONEXO y borrar todos sus datos locales en Windows en 1 clic.

            ---

            ### ⚡ Características Principales:
            - **100% Local y Privado**: Tus cuentas, saldos, previsiones y fondos se guardan en tu equipo.
            - **Scraping Ultra Rápido (2-3s)**: Puppeteer se ejecuta en tu procesador local sin límites ni bloqueos.
            - **Soporte PWA y Web**: Exportación e importación cifrada (AES-256), JSON, CSV y XLSX.
          files: |
            release-binaries/*.dmg
            release-binaries/*.exe
            release-binaries/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
