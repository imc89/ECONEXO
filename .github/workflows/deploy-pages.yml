# ==============================================================================
# Nombre del flujo de trabajo visible en la pestaña "Actions" de GitHub
# ==============================================================================
name: Despliegue de ECONEXO en GitHub Pages

# ==============================================================================
# Disparadores (Eventos que inician la ejecución de este flujo)
# ==============================================================================
on:
  # Se ejecuta automáticamente cada vez que se hace un 'git push' a la rama 'main'
  push:
    branches:
      - main

  # Permite ejecutar este flujo manualmente con un botón desde la interfaz web de GitHub Actions
  workflow_dispatch:

# ==============================================================================
# Permisos requeridos por el token de seguridad temporal de GitHub (GITHUB_TOKEN)
# ==============================================================================
permissions:
  contents: read      # Permiso para clonar y leer el código fuente del repositorio
  pages: write         # Permiso para publicar y escribir contenido en GitHub Pages
  id-token: write      # Permiso para autenticarse de forma segura con el servicio de Pages de GitHub

# ==============================================================================
# Control de concurrencia: evita que dos despliegues simultáneos entren en conflicto
# ==============================================================================
concurrency:
  group: "pages"              # Identificador del grupo de tareas de Pages
  cancel-in-progress: false   # Espera a que termine un despliegue en curso antes de lanzar el siguiente

# ==============================================================================
# Definición de los trabajos (Jobs) a ejecutar
# ==============================================================================
jobs:
  # Trabajo principal de despliegue
  deploy:
    # Vincula la ejecución al entorno oficial "github-pages" de GitHub
    environment:
      name: github-pages
      # URL pública generada automáticamente que se mostrará en el resumen de la ejecución
      url: ${{ steps.deployment.outputs.page_url }}

    # Sistema operativo de la máquina virtual temporal donde se ejecutan los pasos
    runs-on: ubuntu-latest

    # Secuencia ordenada de pasos que realiza la máquina virtual
    steps:
      # Paso 1: Descarga el código del repositorio en la máquina virtual
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      # Paso 2: Configura y prepara los metadatos de GitHub Pages en el entorno
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # Paso 3: Empaqueta únicamente la carpeta 'public' como artefacto de Pages
      # (Allí están index.html, JS, CSS, imágenes y manifest; no expone archivos de servidor)
      - name: Empaquetar la carpeta estática (public)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      # Paso 4: Publica el artefacto empaquetado en el servicio oficial de GitHub Pages
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
